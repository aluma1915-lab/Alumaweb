<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluma | Accesorios de Lujo</title>
  <meta name="description" content="Aluma — accesorios y joyería de autor. Piezas delicadas y atemporales.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #faf8f5; /* Tono crema elegante de Aluma */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333333;
      text-align: center;
      padding: 20px;
    }
    .loader-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      max-width: 360px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    p {
      font-size: 14px;
      color: #777777;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #d4af37; /* Tono dorado */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="loader-card">
    <h1>ALUMA</h1>
    <p>Cargando tienda...</p>
    <div class="spinner"></div>
  </div>

  <script>
    // URL de ejecución de tu Apps Script
    const appUrl = "https://script.google.com/macros/s/AKfycbzKkyzyYX78zbg1gal6WySclAxyjF912goCfTEGAzFw5NJJah-h8yV5LokKgTmK2olq/exec";

    // Redirección directa para evitar bloqueos de iFrame/Cookies en celulares
    window.location.replace(appUrl);
  </script>

</body>
</html>
