<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluma | Accesorios de Lujo</title>
  <meta name="description" content="Aluma — accesorios y joyería de autor. Piezas delicadas y atemporales.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #faf8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333333;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      padding: 40px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 380px;
      width: 100%;
    }
    h1 {
      font-size: 26px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #1a1a1a;
      font-weight: 600;
    }
    p {
      font-size: 14px;
      color: #666666;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn-aluma {
      display: inline-block;
      width: 100%;
      background-color: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      padding: 16px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 1px;
      transition: background-color 0.2s ease;
    }
    .btn-aluma:active {
      background-color: #d4af37;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>ALUMA</h1>
    <p>Haz clic abajo para ingresar a nuestra colección y tienda virtual.</p>
    <a id="btnLink" class="btn-aluma" href="#">INGRESAR A LA TIENDA</a>
  </div>

  <script>
    const targetUrl = "https://script.google.com/macros/s/AKfycbzKkyzyYX78zbg1gal6WySclAxyjF912goCfTEGAzFw5NJJah-h8yV5LokKgTmK2olq/exec";
    
    // Forzamos la apertura directa como interacción de usuario real
    const btn = document.getElementById('btnLink');
    btn.href = targetUrl;
    btn.target = "_blank"; // Abre en pestaña limpia del navegador predeterminado
  </script>

</body>
</html>
